<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADNESS: UNDERDOG 상태창 URL 생성기</title>
<style>
  :root{--bg:#120709;--card:#1c0d11;--red:#d4202e;--purple:#c9a2e6;--txt:#eee;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:24px;line-height:1.5}
  h1{color:var(--red);font-size:20px;margin:0 0 4px}
  p.sub{color:#aaa;margin:0 0 20px;font-size:13px}
  .wrap{max-width:820px;margin:0 auto}
  label{display:block;font-size:13px;color:#f2c;color:#e8b4f0;margin:14px 0 4px;font-weight:700}
  input{width:100%;padding:9px 11px;background:#0d0608;border:1px solid #4a2530;border-radius:6px;color:#fff;font-size:14px}
  input:focus{outline:none;border-color:var(--purple)}
  .hint{font-size:11px;color:#888;margin-top:3px}
  .checks{display:flex;gap:18px;margin-top:4px}
  .ck{display:flex;align-items:center;gap:6px;color:#fff;font-weight:400;margin:0;cursor:pointer}
  .ck input{width:auto}
  .out{margin-top:22px;background:var(--card);border:1px solid #3a1c22;border-radius:10px;padding:14px}
  .out b{color:var(--purple);font-size:12px;letter-spacing:.5px}
  textarea{width:100%;height:64px;margin-top:6px;background:#0d0608;border:1px solid #4a2530;border-radius:6px;color:#9fe6b0;font-size:12px;padding:8px;resize:vertical}
  button{margin-top:8px;background:var(--red);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  img.preview{width:100%;margin-top:16px;border:1px solid #3a1c22;border-radius:8px;background:#000}
  .note{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MADNESS: UNDERDOG · 상태창 URL 생성기</h1>
  <p class="sub">값을 입력하면 마크다운 삽입용 주소가 자동으로 만들어집니다. DAMAGE / INVENTORY 는 마침표(.)로 여러 개를 구분하세요.</p>

  <label>STATUS · 현재 상황</label>
  <input id="status" placeholder="예: 전투 중 (in combat)">
  <label>STATE · 상태</label>
  <input id="state" placeholder="예: 중상">
  <label>DAMAGE · 손상 부위 (최대 5개, 마침표로 구분)</label>
  <input id="damage" placeholder="좌측 전완 결손.늑골 3개 파손.경추 봉합 불안정">
  <label>INVENTORY · 소지품 (최대 5개, 마침표로 구분)</label>
  <input id="inventory" placeholder="구형 리볼버.탄창 2개.붕대.진통제.식별표">
  <label>FACTION · 소속</label>
  <input id="faction" placeholder="예: 에덴 본부 / 없음">
  <label>소유 장치 (배경이 바뀝니다)</label>
  <div class="checks">
    <label class="ck"><input type="checkbox" id="thruster"> 비개현성 추진기</label>
    <label class="ck"><input type="checkbox" id="halo"> 헤일로</label>
  </div>
  <label>출력 % (노멀 배경에서는 표시 안 됨)</label>
  <input id="power" placeholder="예: 73 (숫자만)">

  <div class="out">
    <b>마크다운 (크랙에 붙여넣기)</b>
    <textarea id="md" readonly></textarea>
    <button onclick="copyMd()">복사</button>
    <div class="note">아래 미리보기는 이 페이지가 배포된 도메인 기준으로 실시간 렌더링됩니다.</div>
    <img class="preview" id="prev" alt="preview">
  </div>
</div>
<script>
  const ids = ["status","state","damage","inventory","faction","power"];
  const checks = ["thruster","halo"];
  // 이 페이지가 올라간 도메인의 /api/status 를 그대로 사용
  const base = location.origin + "/api/status";
  function build(){
    const p = new URLSearchParams();
    ids.forEach(id=>{ const v=document.getElementById(id).value.trim(); if(v) p.set(id, v); });
    checks.forEach(id=>{ if(document.getElementById(id).checked) p.set(id, "1"); });
    const url = base + "?" + p.toString();
    document.getElementById("md").value = "![](" + url + ")";
    document.getElementById("prev").src = url + (p.toString()? "&":"?") + "_t=" + Date.now();
  }
  ids.forEach(id=>document.getElementById(id).addEventListener("input", build));
  checks.forEach(id=>document.getElementById(id).addEventListener("change", build));
  function copyMd(){ const t=document.getElementById("md"); t.select(); document.execCommand("copy"); }
  build();
</script>
</body>
</html>
