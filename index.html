<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERLAP 상태창 URL 생성기</title>
<style>
  :root{--bg:#0a0304;--card:#180809;--red:#d10d0e;--txt:#f2d9d9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:24px;line-height:1.5}
  h1{color:var(--red);font-size:20px;margin:0 0 4px}
  p.sub{color:#9a8a8a;margin:0 0 20px;font-size:13px}
  .wrap{max-width:860px;margin:0 auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:13px;color:#e8b4b4;margin:12px 0 4px;font-weight:700}
  input,select{width:100%;padding:9px 11px;background:#0d0506;border:1px solid #4a2528;border-radius:6px;color:#fff;font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--red)}
  .full{grid-column:1 / -1}
  .hint{font-size:11px;color:#7a6a6a;margin-top:3px}
  .out{margin-top:22px;background:var(--card);border:1px solid #3a1c1e;border-radius:10px;padding:14px}
  .out b{color:var(--red);font-size:12px;letter-spacing:.5px}
  textarea{width:100%;height:60px;margin-top:6px;background:#0d0506;border:1px solid #4a2528;border-radius:6px;color:#9fe6b0;font-size:12px;padding:8px;resize:vertical}
  button{margin-top:8px;background:var(--red);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  img.preview{width:100%;margin-top:16px;border:1px solid #3a1c1e;border-radius:8px;background:#000}
  .note{font-size:12px;color:#7a6a6a;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OVERLAP · 상태창 URL 생성기</h1>
  <p class="sub">값을 입력하면 마크다운 삽입용 주소가 자동으로 만들어집니다. 인벤토리·인연·부상은 마침표(.)로 여러 개를 구분하세요.</p>

  <div class="grid">
    <div>
      <label>소유 상태 (배경)</label>
      <select id="s">
        <option value="n">기본</option>
        <option value="t">비개현성 추진기</option>
        <option value="h">헤일로</option>
        <option value="b">둘 다</option>
      </select>
    </div>
    <div>
      <label>출력 % (추진기/헤일로일 때만 표시)</label>
      <input id="power" placeholder="예: 73 (숫자만)">
    </div>

    <div>
      <label>날짜</label>
      <input id="d" placeholder="예: 2026.05.06">
    </div>
    <div>
      <label>시간</label>
      <input id="t" placeholder="예: 22:47">
    </div>

    <div>
      <label>위치 (LOCATION)</label>
      <input id="l" placeholder="예: 림보토미아 지하">
    </div>
    <div>
      <label>소속 (FACTION)</label>
      <input id="f" placeholder="예: 붉은 둥지">
    </div>

    <div>
      <label>턴수 (Turn, 숫자)</label>
      <input id="tn" placeholder="예: 3">
    </div>
    <div>
      <label>NEST</label>
      <input id="nest" placeholder="예: 활성">
    </div>

    <div class="full">
      <label>INVENTORY · 소지품 (최대 12개, 마침표 구분 · 앞 6개 왼쪽 / 다음 6개 오른쪽)</label>
      <input id="inv" placeholder="권총.단검.붕대.진통제.식별표.수통">
    </div>
    <div class="full">
      <label>RELATIONSHIP · 인연 (최대 12개, 마침표 구분 · 앞 6개 왼쪽 / 다음 6개 오른쪽)</label>
      <input id="rel" placeholder="김하늘 - 동료.박서준 - 적대.이도현 - 불명">
    </div>
    <div class="full">
      <label>부상 (마침표 구분 · 랜덤 반투명 박스로 흩뿌려짐)</label>
      <input id="dmg" placeholder="좌완 골절.늑골 파손.두개골 균열">
    </div>
  </div>

  <div class="out">
    <b>마크다운 (크랙에 붙여넣기)</b>
    <textarea id="md" readonly></textarea>
    <button onclick="copyMd()">복사</button>
    <div class="note">아래 미리보기는 이 페이지가 배포된 도메인 기준으로 실시간 렌더링됩니다.</div>
    <img class="preview" id="prev" alt="preview">
  </div>
</div>
<script>
  const ids = ["d","t","l","f","tn","nest","power","inv","rel","dmg"];
  const base = location.origin + "/api/status";
  function build(){
    const p = new URLSearchParams();
    const s = document.getElementById("s").value;
    if (s && s !== "n") p.set("s", s);
    ids.forEach(id=>{ const v=document.getElementById(id).value.trim(); if(v) p.set(id, v); });
    const qs = p.toString();
    const url = base + (qs ? "?" + qs : "");
    document.getElementById("md").value = "![](" + url + ")";
    document.getElementById("prev").src = url + (qs ? "&" : "?") + "_t=" + Date.now();
  }
  ids.forEach(id=>document.getElementById(id).addEventListener("input", build));
  document.getElementById("s").addEventListener("change", build);
  function copyMd(){ const t=document.getElementById("md"); t.select(); document.execCommand("copy"); }
  build();
</script>
</body>
</html>
