<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <!-- 20px 정사각형 2x2 체크무늬 (한 타일 = 40px) -->
    <pattern id="chk" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#140000"/>
      <rect width="20" height="20" fill="#8a1010"/>
      <rect x="20" y="20" width="20" height="20" fill="#8a1010"/>
    </pattern>
    <clipPath id="boxclip"><rect x="250" y="48" width="120" height="112"/></clipPath>
  </defs>

  <!-- 바탕 검정 -->
  <rect width="400" height="200" fill="#0a0000"/>

  <!-- 배경 체크무늬: 왼쪽(←)으로 스크롤 -->
  <g>
    <rect x="-40" y="0" width="480" height="200" fill="url(#chk)"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-40 0" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- FACTION 박스: 안쪽 체크무늬만 오른쪽(→)으로 스크롤 (박스 영역으로 잘라냄) -->
  <g clip-path="url(#boxclip)">
    <g>
      <rect x="200" y="48" width="240" height="112" fill="url(#chk)"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="40 0" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="250" y="48" width="120" height="112" fill="none" stroke="#d10d0e" stroke-width="3"/>
  <text x="310" y="150" fill="#ff7a7a" font-family="sans-serif" font-size="16"
    font-weight="bold" text-anchor="middle">FACTION</text>

  <!-- 안내 문구 -->
  <text x="18" y="28" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">움직이면 성공!  배경 ←  /  박스 →</text>
</svg>
